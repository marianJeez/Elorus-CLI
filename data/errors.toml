# How the client treats each error. Keys are elorus's `error.type`, plus our own kinds for failures
# that never reached elorus. A hint's {api} and {chat} are the configured sites. `retry`: whether
# to retry automatically; without it, 429 and 5xx retry and other statuses do not. `session`: what
# a session does next: `login` opens the login card, `account` shows where the account stands.

[unknown]
title = "Request failed"

# Any status: a body that is not elorus's envelope (a proxy's page, say).
[http_error]
title = "elorus answered with an error"

[network]
title = "Could not reach elorus"
hint = "Check your connection; elorus is at {api}."
retry = true

[timeout]
title = "elorus took too long to answer"
retry = true

[idle_timeout]
title = "The response stalled"
retry = true

[stream_ended]
title = "The response ended early"
retry = true

[bad_stream]
title = "elorus sent something unreadable"

[not_logged_in]
title = "Not logged in"
hint = "Run `elorus login` (or /login in a session) to pair this machine, or set ELORUS_API_KEY."
session = "login"

[bad_request]
title = "elorus rejected the request"

[invalid_api_key]
title = "Your key was not accepted"
hint = "It may have been revoked. Log in again: `elorus login`, or /login in a session."
session = "login"

# Our own: a key refused while login checks it, so it was never in use here.
[key_unknown]
title = "elorus does not know that key"
hint = "Check the account number, or pair this device instead."

[account_disabled]
title = "This account is frozen"
hint = "A card refund or chargeback froze it. Contact admin@elorus.sh."

[insufficient_balance]
title = "Out of funds"
hint = "Top up at {chat}."
session = "account"

[plan_allowance_spent]
title = "Your plan's allowance is used up for now"
hint = "It refills over the day, or turn balance fallback back on: /account in a session, or at {chat}."
session = "account"

# Our own: a summary of earlier turns came back with no text (the model called a tool instead).
[summary_empty]
title = "The summary came back empty"
hint = "Try /compact again; the conversation is unchanged."

[cannot_revoke_current]
title = "That is the key this session uses"
hint = "Revoke it from another device, or /logout here."

[not_found]
title = "elorus has no such thing"

[model_not_found]
title = "That model is not being served"
hint = "Pick a live one from `elorus models`."

[body_too_large]
title = "The request is over elorus's 16 MiB limit"
hint = "/compact summarises earlier turns; if it is still too long, start a new session."

[rate_limited]
title = "Too many requests at once"
retry = true

[tool_error]
title = "A elorus tool failed upstream"
retry = false

[no_model]
title = "No models are live right now"
retry = true

[no_provider]
title = "That model's upstream is not configured"
hint = "Pick another model from `elorus models`."
retry = false

[no_price]
title = "That model has no price quote yet"
retry = true

[price_fault]
title = "That model is off sale while its price settles"
hint = "Pick another model from `elorus models`."
retry = false

[upstream_unavailable]
title = "The model's upstream is unavailable"
hint = "elorus's side, not yours; try again or pick another model."
retry = true

# The vendor's own status passes through, so a 400 is final and a 429 or 5xx is not.
[upstream_error]
title = "The model's vendor refused the request"

[content_filter]
title = "The model's content filter stopped the reply"
hint = "Rephrase, or try another model."

[bad_response]
title = "elorus sent a reply this version cannot read"
hint = "Update elorus; the API may have moved on."

[pair_expired]
title = "The pairing code expired or was already used"
hint = "Log in again for a fresh code."

[pow_required]
title = "The proof of work expired before it was used"

[pow_too_hard]
title = "elorus asked for more work than this machine will do"
hint = "Many signups came from this address; try again later."

[tool_unavailable]
title = "That elorus tool is off right now"
retry = true

# Third-party providers (src/providers): an unknown provider, or one with no usable key here.
[provider_unknown]
title = "No such provider"
hint = "See `elorus providers`; add one in ~/.elorus/providers.toml."

[provider_key_missing]
title = "No key for this provider"
hint = "Run `elorus providers set-key <id>`, or set the variable the provider names."

[provider_key_unreadable]
title = "The provider's key is unreadable"
hint = "Set it again with `elorus providers set-key <id>`."
