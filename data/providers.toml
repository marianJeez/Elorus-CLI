# Third-party model providers elorus can talk to besides its own gateway.
#
# A provider is one connection: where it lives, which wire it speaks and where its key comes
# from. `wire` is `openai` (chat completions, `/models`) or `anthropic` (messages, `/models`).
# `key_env` names the variable a key is read from first; `elorus providers set-key` stores one
# sealed under ~/.elorus when there is no variable. A provider with no `key_env` needs no key
# unless one is stored (a local server, say).
#
# `models` are the ones known offline, with the limits and prices the table shows. Whatever
# `GET {base_url}/models` adds is listed too, with unknown prices and limits left blank.
# Users add or override providers in ~/.elorus/providers.toml, same shape, by id.

[[provider]]
id = "openai"
label = "OpenAI"
wire = "openai"
base_url = "https://api.openai.com/v1"
key_env = "OPENAI_API_KEY"

[[provider.model]]
id = "gpt-4o-mini"
name = "GPT-4o mini"
context = 128000
max_output = 16384
input = 0.15
cached = 0.075
output = 0.6
tools = true
temperature = true
caching = true

